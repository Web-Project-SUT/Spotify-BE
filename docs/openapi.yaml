        artist:
          type: string
          format: uuid
          readOnly: true
        album:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        title:
          type: string
          maxLength: 120
        genre:
          type: string
          maxLength: 40
        releaseYear:
          type: integer
          maximum: 32767
          minimum: 0
