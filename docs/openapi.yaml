tags:
- name: Auth
  description: Registration, login, token refresh, password reset.
- name: Account
  description: The current user's profile, avatar, and preferences.
- name: Users & Follows
  description: Public user profiles and the follow graph.
- name: Artists
  description: Artist profiles, approval, and sample works.
- name: Albums
  description: Album CRUD and cover art.
- name: Tracks
  description: Track CRUD, search/filter/sort, cover/audio uploads.
- name: Streaming
  description: Playback recording and authenticated downloads.
- name: Recommendations
  description: Personalized track recommendations.
- name: Playlists
  description: Playlist CRUD, track ordering, and covers.
- name: Reports
  description: Artist, support, and admin reporting/statistics.
- name: Payments & Subscriptions
  description: Subscription plans and payment gateway integration.
