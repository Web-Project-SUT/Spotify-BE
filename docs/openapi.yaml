    name: Spotify Clone API
  license:
    name: MIT
paths:
  /api/albums/:
    get:
      operationId: albums_list
      summary: List albums
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
        description: 1-indexed page number.
      - in: query
        name: pageSize
        schema:
          type: integer
        description: Items per page, max 100.
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumListList'
          description: ''
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: albums_create
      description: Approved artists only.
      summary: Create an album
      tags:
      - Albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlbumWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ValidationError:
                  value:
                    detail: Validation failed.
                    code: error
                    fields:
                      field_name:
                      - This field is required.
                  summary: validation_error
          description: Validation failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PermissionDenied:
                  value:
                    detail: You do not have permission to perform this action.
                    code: permission_denied
                    fields: null
                  summary: permission_denied
          description: Authenticated, but not permitted to perform this action.
        '401':
          description: Missing, invalid, or expired bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
