        releasedAt:
          type: string
          format: date-time
        releaseType:
          $ref: '#/components/schemas/ReleaseTypeEnum'
        durationMs:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        playCount:
          type: integer
          readOnly: true
        uniqueListenerCount:
          type: integer
          readOnly: true
        earlyAccessUntil:
          type: string
          format: date-time
          nullable: true
        cover:
          type: string
          format: uri
          nullable: true
