          type: string
          format: uri
          nullable: true
        audioLow:
          type: string
          format: uri
          nullable: true
      required:
      - album
      - artist
      - id
      - playCount
      - title
      - uniqueListenerCount
    TrackStat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cover:
          type: string
          format: uri
          nullable: true
        streamCount:
          type: integer
        listenerCount:
          type: integer
        earnings:
