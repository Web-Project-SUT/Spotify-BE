[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py"]
